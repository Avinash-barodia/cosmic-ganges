<style>
:root{
  --ivory:#FBF6EC; --cream:#F3E8D8; --moon:#FAF8F5;
  --sage:#AEBBA1; --rose:#D9AEA4; --taupe:#B79C85;
  --gold:#C9A65B; --champagne:#E9DCBB; --indigo:#ACA7D9;
  --ink:#3B372E; --ink-soft:#6b6459;
  --shadow:0 20px 60px rgba(80,65,45,0.08);
  --ease:cubic-bezier(.22,.61,.36,1);
  --c1: var(--indigo); --c2: var(--rose);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--ivory); color:var(--ink); font-family:'Inter',sans-serif; font-size:17.5px; line-height:1.8; padding-top: 0;}
h1,h2,h3,.serif{font-family:'Fraunces',serif; font-weight:400; letter-spacing:-0.01em; color:var(--ink);}
.eyebrow{font-family:'Inter'; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--taupe); font-weight:500; display:inline-block; margin-bottom:16px;}
a{color:inherit;}
.wrap{max-width:820px; margin:0 auto; padding:0 8vw;}
@media(min-width:900px){.wrap{padding:0 6vw;}}
section{padding:40px 0;}
.fade{animation:fadeIn .8s var(--ease);}
@keyframes fadeIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}



/* SWITCHER */
.switcher{position:sticky; top:85px; margin-top: 90px; z-index:50; background:var(--ivory); padding:16px 6vw 18px; border-bottom:1px solid rgba(60,50,40,.08); overflow-x:auto; white-space:nowrap;}
.switcher-inner{display:inline-flex; gap:10px; margin:0 auto;}
.tab{font-family:'Inter'; font-size:13.5px; padding:10px 18px; border-radius:30px; border:1px solid rgba(60,50,40,.15); background:var(--moon); cursor:pointer; transition:all .35s var(--ease); color:var(--ink-soft);}
.tab:hover{border-color:var(--taupe);}
.tab.active{background:var(--ink); color:var(--ivory); border-color:var(--ink);}

/* HERO (per service) */
.d-hero{padding-top:40px; text-align:center;}
.d-hero .swatch{width:100%; max-width:640px; height:180px; margin:0 auto 40px; border-radius:22px; background:linear-gradient(135deg,var(--c1),var(--c2)); box-shadow:var(--shadow); position:relative; overflow:hidden;}
.d-hero .swatch::after{content:''; position:absolute; inset:0; background:radial-gradient(circle at 70% 20%, rgba(255,255,255,.4), transparent 45%);}
.d-hero h1{font-size:clamp(28px,4vw,42px); font-style:italic; line-height:1.3; max-width:16ch; margin:0 auto 22px;}
.d-hero p{color:var(--ink-soft); max-width:56ch; margin:0 auto; font-size:18px;}

/* numbered section blocks */
.d-section{border-top:1px solid rgba(60,50,40,.08);}
.d-num{font-family:'Fraunces'; font-style:italic; color:var(--gold); font-size:14px; display:block; margin-bottom:12px;}
.d-section h2{font-size:clamp(22px,2.6vw,28px); margin-bottom:20px; line-height:1.35;}
.d-section p{color:var(--ink-soft); margin-bottom:14px;}

/* before/during/after */
.bda-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:10px;}
@media(max-width:700px){.bda-grid{grid-template-columns:1fr;}}
.bda-card{background:var(--moon); border-radius:16px; padding:24px; box-shadow:var(--shadow);}
.bda-card .lbl{font-family:'Fraunces'; font-style:italic; color:var(--gold); font-size:13.5px; display:block; margin-bottom:8px;}
.bda-card p{font-size:14.5px; color:var(--ink-soft); margin:0;}

/* expect list */
.expect-list{list-style:none; margin-top:8px;}
.expect-list li{padding:12px 0 12px 26px; border-bottom:1px solid rgba(60,50,40,.08); position:relative; color:var(--ink-soft); font-size:15.5px;}
.expect-list li::before{content:'✧'; position:absolute; left:0; top:12px; color:var(--gold); font-size:13px;}

/* resonate / not-for */
.res-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:10px;}
@media(max-width:700px){.res-grid{grid-template-columns:1fr;}}
.res-card{padding:24px; border-radius:16px;}
.res-card.yes{background:#F1F4EE; border:1px solid rgba(139,154,125,.25);}
.res-card.no{background:#F6EFEA; border:1px solid rgba(183,156,133,.25);}
.res-card .lbl{font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:500; color:var(--ink-soft); display:block; margin-bottom:12px;}
.res-card ul{list-style:none;}
.res-card li{padding:6px 0; font-size:14.5px; color:var(--ink-soft);}

/* founder mini (shared, static) */
.founder-mini{display:flex; gap:24px; align-items:center; background:var(--cream); border-radius:20px; padding:28px;}
.founder-mini .fp{width:84px; height:84px; border-radius:50%; flex-shrink:0; background:linear-gradient(160deg,var(--sage),var(--taupe));}
.founder-mini p{color:var(--ink-soft); font-size:15px; margin:0;}
.founder-mini strong{color:var(--ink); font-family:'Fraunces'; font-style:italic; font-weight:400; font-size:16px; display:block; margin-bottom:6px;}
@media(max-width:600px){
  .founder-mini{flex-direction:column; text-align:center; padding:24px 20px; gap:16px;}
}

/* faq */
.faq-item{border-bottom:1px solid rgba(60,50,40,.12);}
.faq-q{width:100%; text-align:left; background:none; border:none; padding:20px 0; font-family:'Fraunces'; font-size:17px; color:var(--ink); display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
.faq-q .plus{font-size:19px; color:var(--taupe); transition:transform .4s var(--ease);}
.faq-item.open .plus{transform:rotate(45deg);}
.faq-a{max-height:0; overflow:hidden; transition:max-height .5s var(--ease);}
.faq-a p{padding:0 0 20px; color:var(--ink-soft); font-size:15px;}

/* cta */
.d-cta{text-align:center; background:linear-gradient(160deg,var(--cream),var(--c2) 70%,var(--c1)); border-radius:28px; margin:0 6vw; padding:70px 8vw;}
.d-cta h2{font-size:clamp(24px,3vw,32px); font-style:italic; margin-bottom:14px;}
.d-cta p{color:var(--ink-soft); margin-bottom:28px;}
.btn-primary{display:inline-block; padding:15px 32px; background:var(--ink); color:var(--ivory); text-decoration:none; border-radius:40px; font-size:14.5px; transition:transform .5s var(--ease), box-shadow .5s var(--ease);}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 14px 34px rgba(60,45,20,.22);}
.d-cta .final-line{margin-top:22px; font-family:'Fraunces'; font-style:italic; color:var(--ink-soft); font-size:14.5px;}

footer{text-align:center; padding:60px 6vw 40px; color:var(--ink-soft); font-size:13.5px;}
</style>

const tabRow = document.getElementById('tabRow');
const content = document.getElementById('content');

Object.keys(SERVICES).forEach(key=>{
  const btn = document.createElement('button');
  btn.className = 'tab';
  btn.textContent = SERVICES[key].name;
  btn.dataset.key = key;
  btn.addEventListener('click', ()=>render(key));
  tabRow.appendChild(btn);
});

      <h2>${s.name}, Simply Explained</h2>
      <p>${s.whatIs}</p>
    </section>

      <span class="d-num">02. How It May Support Your Journey</span>
      <h2>Why People Return to This</h2>

      <h2>Before, During, After</h2>
      <div class="bda-grid">

        <div class="bda-card"><span class="lbl">During</span><p>${s.during}</p></div>
        <div class="bda-card"><span class="lbl">After</span><p>${s.after}</p></div>

    </section>

    <section class="d-section fade">
      <span class="d-num">04. What You Can Expect</span>
      <h2>Practical Details</h2>
      <ul class="expect-list">${s.expect.map(e=>`<li>${e}</li>`).join('')}</ul>
    </section>

    <section class="d-section fade">
      <span class="d-num">05. Who This May Be For</span>
      <h2>Is This the Right Path Right Now?</h2>
      <div class="res-grid">
        <div class="res-card yes"><span class="lbl">This may resonate if…</span><ul>${s.resonate.map(r=>`<li>${r}</li>`).join('')}</ul></div>
        <div class="res-card no"><span class="lbl">You may prefer another path if…</span><ul>${s.notFor.map(r=>`<li>${r}</li>`).join('')}</ul></div>
      </div>
    </section>

    <section class="d-section fade">
      <span class="d-num">06. Meet Neelam</span>
      <div class="founder-mini">
        <div class="fp"></div>
        <p><strong>A guide who listens.</strong>Neelam's approach is gentle, intuitive and deeply personal. Creating space for you to slow down and reconnect with your own inner wisdom, at your own pace.</p>
      </div>
    </section>

    <section class="d-section fade">
      <span class="d-num">07. Frequently Asked Questions</span>
      <h2>About ${s.name}</h2>
      <div class="faq-list">
        ${s.faq.map(([q,a])=>`
          <div class="faq-item">
            <button class="faq-q">${q}<span class="plus">+</span></button>
            <div class="faq-a"><p>${a}</p></div>
          </div>`).join('')}
      </div>
    </section>

    <section>
      <div class="d-cta fade">
        <span class="eyebrow">Whenever You're Ready</span>
        <h2>Explore ${s.name} With Neelam</h2>
        <p>There's no wrong time to begin, and no pressure to decide today.</p>
        <a href="#" class="btn-primary">Reserve Your Healing Space</a>
        <p class="final-line">Come as you are.</p>
      </div>
    </section>
  `;

  content.querySelectorAll('.faq-q').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = btn.closest('.faq-item');
      const answer = item.querySelector('.faq-a');
      const isOpen = item.classList.contains('open');
      content.querySelectorAll('.faq-item.open').forEach(o=>{
        o.classList.remove('open');
        o.querySelector('.faq-a').style.maxHeight = null;
      });
      if(!isOpen){
        item.classList.add('open');
        answer.style.maxHeight = answer.scrollHeight + 'px';
      }
    });
  });

  window.scrollTo({top:0, behavior:'smooth'});
}

// Check if there is a hash in the URL and if it matches a service key
const initialTab = window.location.hash.replace('#', '');
if (initialTab && SERVICES[initialTab]) {
  render(initialTab);
} else {
  render('cosmic');
}
</script>

</body>
</html>
