.wrap{max-width:820px; margin:0 auto; padding:0 8vw;}

section{padding:40px 0;}
.fade{animation:fadeIn .8s var(--ease);}

.faq-a p{padding:0 0 20px; color:var(--ink-soft); font-size:15px;}

footer{text-align:center; padding:60px 6vw 40px; color:var(--ink-soft); font-size:13.5px;}

const tabRow = document.getElementById('tabRow');
const content = document.getElementById('content');

Object.keys(SERVICES).forEach(key=>{
  const btn = document.createElement('button');
  btn.className = 'tab';
  btn.textContent = SERVICES[key].name;
  btn.dataset.key = key;
  btn.addEventListener('click', ()=>render(key));
  tabRow.appendChild(btn);
});

function render(key){
  const s = SERVICES[key];
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.key===key));
  document.documentElement.style.setProperty('--c1', s.c1);
  document.documentElement.style.setProperty('--c2', s.c2);

  content.innerHTML = `
    <section class="d-hero fade">
      <span class="eyebrow">${s.category}</span>
      <div class="swatch"></div>
      <h1>${s.headline}</h1>
      <p>${s.recognition}</p>
    </section>

    <section class="d-section fade">
      <span class="d-num">01. What This Experience Is</span>
      <h2>${s.name}, Simply Explained</h2>
      <p>${s.whatIs}</p>
    </section>

    <section class="d-section fade">
      <span class="d-num">02. How It May Support Your Journey</span>
      <h2>Why People Return to This</h2>
      <p>${s.howSupports}</p>
    </section>

    <section class="d-section fade">
      <span class="d-num">03. What a Session Feels Like</span>
      <h2>Before, During, After</h2>
      <div class="bda-grid">
        <div class="bda-card"><span class="lbl">Before</span><p>${s.before}</p></div>
        <div class="bda-card"><span class="lbl">During</span><p>${s.during}</p></div>
        <div class="bda-card"><span class="lbl">After</span><p>${s.after}</p></div>
      </div>
    </section>

    <section class="d-section fade">
      <span class="d-num">04. What You Can Expect</span>
      <h2>Practical Details</h2>
      <ul class="expect-list">${s.expect.map(e=>`<li>${e}</li>`).join('')}</ul>
    </section>

    <section class="d-section fade">
      <span class="d-num">05. Who This May Be For</span>
      <h2>Is This the Right Path Right Now?</h2>
      <div class="res-grid">
        <div class="res-card yes"><span class="lbl">This may resonate if…</span><ul>${s.resonate.map(r=>`<li>${r}</li>`).join('')}</ul></div>
        <div class="res-card no"><span class="lbl">You may prefer another path if…</span><ul>${s.notFor.map(r=>`<li>${r}</li>`).join('')}</ul></div>
      </div>
    </section>

    <section class="d-section fade">
      <span class="d-num">06. Meet Neelam</span>
      <div class="founder-mini">
        <div class="fp"></div>
        <p><strong>A guide who listens.</strong>Neelam's approach is gentle, intuitive and deeply personal. Creating space for you to slow down and reconnect with your own inner wisdom, at your own pace.</p>
      </div>
    </section>

    <section class="d-section fade">
      <span class="d-num">07. Frequently Asked Questions</span>
      <h2>About ${s.name}</h2>
      <div class="faq-list">
        ${s.faq.map(([q,a])=>`
          <div class="faq-item">
            <button class="faq-q">${q}<span class="plus">+</span></button>
            <div class="faq-a"><p>${a}</p></div>
          </div>`).join('')}
      </div>
    </section>

    <section>
      <div class="d-cta fade">
        <span class="eyebrow">Whenever You're Ready</span>

  content.querySelectorAll('.faq-q').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = btn.closest('.faq-item');
      const answer = item.querySelector('.faq-a');
      const isOpen = item.classList.contains('open');
      content.querySelectorAll('.faq-item.open').forEach(o=>{
        o.classList.remove('open');
        o.querySelector('.faq-a').style.maxHeight = null;
      });
      if(!isOpen){
        item.classList.add('open');
        answer.style.maxHeight = answer.scrollHeight + 'px';
      }
    });
  });

  window.scrollTo({top:0, behavior:'smooth'});
}

// Check if there is a hash in the URL and if it matches a service key
const initialTab = window.location.hash.replace('#', '');
if (initialTab && SERVICES[initialTab]) {
  render(initialTab);
} else {
  render('cosmic');
}
